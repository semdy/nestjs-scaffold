services:
  api:
    build:
      context: .
      target: deps
    command: npm run start:dev
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      - postgres
      - redis
      - rabbitmq

  migrate:
    build:
      context: .
      target: deps
    command: npm run migration:run
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'wal_level=logical',
        '-c',
        'max_wal_senders=10',
        '-c',
        'max_replication_slots=10',
      ]
    environment:
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_DATABASE:-app}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:9
    profiles: ['mysql']
    command:
      [
        '--server-id=223344',
        '--log-bin=mysql-bin',
        '--binlog-format=ROW',
        '--binlog-row-image=FULL',
        '--gtid-mode=ON',
        '--enforce-gtid-consistency=ON',
      ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
      MYSQL_DATABASE: ${DB_DATABASE:-app}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

  debezium:
    image: quay.io/debezium/server:3.5.2.Final
    profiles: ['cdc']
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      DEBEZIUM_SOURCE_DATABASE_HOST: ${DEBEZIUM_SOURCE_DATABASE_HOST:-postgres}
      DEBEZIUM_SOURCE_DATABASE_PORT: ${DEBEZIUM_SOURCE_DATABASE_PORT:-5432}
      DEBEZIUM_SOURCE_DATABASE_USER: ${DEBEZIUM_SOURCE_DATABASE_USER:-app}
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${DEBEZIUM_SOURCE_DATABASE_PASSWORD:-app}
      DEBEZIUM_SOURCE_DATABASE_DBNAME: ${DEBEZIUM_SOURCE_DATABASE_DBNAME:-app}
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: ${DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST:-public.outbox_events}
      DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST: ${DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST:-public}
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./docker/debezium/application.properties:/debezium/config/application.properties:ro
      - debezium-data:/debezium/data
    ports:
      - '8080:8080'

volumes:
  debezium-data:
  postgres-data:
  mysql-data:
  redis-data:
  rabbitmq-data:
