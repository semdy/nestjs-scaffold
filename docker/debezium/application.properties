debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST:rabbitmq}
debezium.sink.rabbitmq.connection.port=${RABBITMQ_PORT:5672}
debezium.sink.rabbitmq.connection.username=${RABBITMQ_USER:app}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_PASSWORD:app}
debezium.sink.rabbitmq.exchange=${DEBEZIUM_RABBITMQ_EXCHANGE:app.events}
debezium.sink.rabbitmq.ackTimeout=3000

debezium.source.connector.class=${DEBEZIUM_SOURCE_CONNECTOR_CLASS:io.debezium.connector.postgresql.PostgresConnector}
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=${DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE:data/offsets.dat}
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=${DEBEZIUM_SOURCE_SCHEMA_HISTORY_FILE:data/schema-history.dat}
debezium.source.topic.prefix=outbox
debezium.source.database.hostname=${DEBEZIUM_SOURCE_DATABASE_HOST:postgres}
debezium.source.database.port=${DEBEZIUM_SOURCE_DATABASE_PORT:5432}
debezium.source.database.user=${DEBEZIUM_SOURCE_DATABASE_USER:app}
debezium.source.database.password=${DEBEZIUM_SOURCE_DATABASE_PASSWORD:app}
debezium.source.database.dbname=${DEBEZIUM_SOURCE_DATABASE_DBNAME:app}
debezium.source.database.include.list=${DEBEZIUM_SOURCE_DATABASE_DBNAME:app}
debezium.source.database.server.id=${DEBEZIUM_SOURCE_DATABASE_SERVER_ID:5401}
debezium.source.plugin.name=${DEBEZIUM_SOURCE_PLUGIN_NAME:pgoutput}
debezium.source.slot.name=${DEBEZIUM_SOURCE_SLOT_NAME:nestjs_outbox}
debezium.source.publication.name=${DEBEZIUM_SOURCE_PUBLICATION_NAME:nestjs_outbox_pub}
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=${DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST:public}
debezium.source.table.include.list=${DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST:public.outbox_events}
debezium.source.snapshot.mode=${DEBEZIUM_SOURCE_SNAPSHOT_MODE:initial}
debezium.source.include.schema.changes=false
debezium.source.tombstones.on.delete=false

debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.route.by.field=routingKey
debezium.transforms.outbox.route.topic.replacement=$${routedByValue}
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=aggregateId
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.table.field.event.timestamp=createdAt
debezium.transforms.outbox.table.fields.additional.placement=tenantId:envelope:tenantId,aggregateType:envelope:aggregateType,aggregateId:envelope:aggregateId,createdAt:envelope:publishedAt

debezium.format.key=json
debezium.format.value=json
quarkus.http.port=8080
quarkus.log.console.json=false
